# dsh-plus 聚合 bundle 补丁层：按序 insert 本仓库的【正式】插件行。
# 该行会进入 profile 组合树（dsh-base / dsh-web-app 之后、用户 cordis.patch.yml 之前），
# 后续层仍可按 id 覆盖 config 或禁用。
# 注意：示例/演示插件（如 tool-text-transform）不入此层——它们只经 dev profile 的
# 用户补丁层注入，避免随 bundle 进入生产、无效占用模型上下文。
# lifeboat 必须排首位：它是故障救生艇，需先于兄弟插件就绪才能观察它们的失败。
# access-gate 排第二：访问围栏需在 webserver 路由/升级注册稳定后包装拦截，
# 且在 web-files 等兄弟插件之前就绪（包装与注册时序无关，但早注册自有
# 豁免路由更稳）；自身失败由 lifeboat 隔离止损。
# boot-retry 排第三：只注册 index 注入行，无端点、无服务、无时序依赖；
# 靠前只为让「弱网重试」尽早进入注入表（注入行顺序不影响其正确性）。
- insert:
    - id: dsh-plus-lifeboat
      name: '@dsh-plus/lifeboat'
    - id: dsh-plus-access-gate
      name: '@dsh-plus/access-gate'
    - id: dsh-plus-boot-retry
      name: '@dsh-plus/boot-retry'
    - id: dsh-plus-ui-mobile-fit
      name: '@dsh-plus/ui-mobile-fit'
    - id: dsh-plus-remote-settings
      name: '@dsh-plus/remote-settings'
    - id: dsh-plus-notify-email
      name: '@dsh-plus/notify-email'
    - id: dsh-plus-llm-pi
      name: '@dsh-plus/llm-pi'
    - id: dsh-plus-reload
      name: '@dsh-plus/reload'
    - id: dsh-plus-web-files
      name: '@dsh-plus/web-files'
    - id: dsh-plus-web-terminal
      name: '@dsh-plus/web-terminal'
    - id: dsh-plus-usage-panel
      name: '@dsh-plus/usage-panel'
    - id: dsh-plus-subagent-model
      name: '@dsh-plus/subagent-model'
    - id: dsh-plus-secret-env
      name: '@dsh-plus/secret-env'
    - id: dsh-plus-image-studio
      name: '@dsh-plus/image-studio'
    - id: dsh-plus-web-search-services
      name: '@dsh-plus/web-search-services'
    # error-retry 无端点、无服务、无时序依赖；waterfall 次序由其自身的
    # prepend 保证（先于 dsh-llm-retry 改写载荷），插入位置不影响正确性。
    - id: dsh-plus-error-retry
      name: '@dsh-plus/error-retry'
    # web-cache-headers 排末位：进程级 writeHead 增量补丁，无端点、无服务、
    # 无时序依赖；补丁纯增量（已有 cache-control 优先），装上/卸下均安全。
    - id: dsh-plus-web-cache-headers
      name: '@dsh-plus/web-cache-headers'
