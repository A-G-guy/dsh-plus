packages:
  - packages/*
allowBuilds:
  "@google/genai": false
  protobufjs: false
# dsh 自 0.1.2-alpha.2 起发布 npm，@deepseek-ai/* 一律走 registry 解析（钉版见各包
# manifest，dshctl platform-sync 统一改写）。minimumReleaseAgeExclude 对受信任的
# 第一方 scope 整体豁免，防止启用 minimumReleaseAge 时新版发布窗口期被拦。
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"
  - lucide-react@1.38.0
