packages:
  - packages/*
allowBuilds:
  "@google/genai": false
  protobufjs: false
  # node-pty 1.2.0-beta 优先用 prebuilds 免编译；允许其 install 脚本，
  # web-terminal 经 peer 复用宿主单实例（ADR 0001），workspace 内仅开发解析用。
  node-pty: true
# dsh 自 0.1.2-alpha.2 起发布 npm，@deepseek-ai/* 一律走 registry 解析（钉版见各包
# manifest，dshctl platform-sync 统一改写）。minimumReleaseAgeExclude 对受信任的
# 第一方 scope 整体豁免，防止启用 minimumReleaseAge 时新版发布窗口期被拦。
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"

